
name: Mirror GitHub to RWU GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H gitlab.rwu.de >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Push main to RWU GitLab
        run: |
          git push \
            git@gitlab.rwu.de:stud-kleber/pr-2026-morina_malkina.git \
            HEAD:refs/heads/main
