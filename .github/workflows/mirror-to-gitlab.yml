name: Mirror GitHub to GitLab

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "**"
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITLAB_SSH_PRIVATE_KEY }}" > ~/.ssh/gitlab_mirror
          chmod 600 ~/.ssh/gitlab_mirror
          ssh-keyscan gitlab.rwu.de >> ~/.ssh/known_hosts

      - name: Mirror repository to GitLab
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/gitlab_mirror -o StrictHostKeyChecking=yes
        run: |
          git remote add gitlab git@gitlab.rwu.de:stud-kleber/pr-2026-morina_malkina.git
          git push gitlab --all 
          git push gitlab --tags