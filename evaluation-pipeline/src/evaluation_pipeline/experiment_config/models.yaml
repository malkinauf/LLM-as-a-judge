
openrouter:
  allowed_fields:
    model:
      - id
      - label
      - provider
      - reasoning
      - max_tokens
    provider:
      - only
      - allow_fallbacks
    reasoning:
      - enabled

  models:
    - id: "openai/gpt-4.1-mini"
      label: "GPT-4.1 mini"

    - id: "deepseek/deepseek-v4.1-flash-1017"
      label: "DeepSeek-v4.1-flash-1017"
      provider:
        only: ["relace/fp4"]
        allow_fallbacks: false
      reasoning:
        enabled: false

    - id: "google/gemini-2.5-flash"
      label: "Gemini 2.5 Flash"
      provider:
        only: ["google-ai-studio"]
        allow_fallbacks: false
      reasoning:
        enabled: false

    - id: "openai/gpt-5.4-mini"
      label: "GPT-5.4 mini"
      provider:
        only: ["openai"]
        allow_fallbacks: false
      reasoning:
        enabled: false
      max_tokens: 1024

ollama:
  auto_discover: true
