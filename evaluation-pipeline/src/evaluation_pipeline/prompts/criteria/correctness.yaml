name: correctness

descriptions:
  basic: |
    A response is correct if it selects the correct answer to the given multiple-choice question.

  detailed: |
    A response is correct if it selects the correct answer to the given multiple-choice question.

    Apply the following evaluation criteria:

    1. Identify the answer selected or expressed in the model's response.
    2. Determine which of the provided answer choices correctly answers the question, using relevant domain knowledge.
    3. Evaluate correctness based on the selected answer, rather than the quality or length of the accompanying explanation.
    4. A response is incorrect if it selects an incorrect answer or does not provide an identifiable answer.
    
labels:
  positive: correct
  negative: incorrect

dynamic:
  prediction_instructions:

    detailed: |
      Analyze the question and answer below and return:

      1) Key claims or conclusions made in the answer
      2) Relevant facts or principles needed to evaluate those claims
      3) Important reasoning steps that should be checked
      4) Potential points of ambiguity or error

      For multiple-choice questions, identify which answer choice the response
      selects or supports and what reasoning should be verified.

      Do not determine whether the answer is correct or incorrect.
      Do not provide the correct answer.
      Do not provide a final verdict.

    paper_based: |
      Analyze the multiple-choice question and the AI assistant's response below.
      Return exactly two lines of text.

      The first line identifies the answer selected or expressed in the response.

      The second line provides relevant domain knowledge that can help assess whether the selected answer is correct, considering the provided answer choices.

      Do not provide the final correctness classification verdict.